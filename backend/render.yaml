services:
  - type: web
    name: tripnova-backend
    env: node
    plan: free
    src: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
        placeholder: "Enter your Vercel deployment URL (e.g. https://tripnova.vercel.app)"
      - key: NEXT_PUBLIC_API_URL
        sync: false
        placeholder: "Enter your Render backend URL (e.g. https://tripnova-backend.onrender.com/api/v1)"
